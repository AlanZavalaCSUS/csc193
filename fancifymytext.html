<!---A field for users to enter large (multi-line) amounts of text.
It should be 4 rows by 30 columns in size.
Wrap it in a bordered field set box with the label "Text".
Add a second bordered field set box labeled "Fancify" that contains the following controls:
A button labeled: Bigger!
Two radio buttons labeled "FancyShmancy" and "BoringBetty"--->


<!DOCTYPE html>
<html>
	<head>
		<title>Fancify Shamcify</title>

		<script src="fancifymytext.js"></script>
		
	</head>

	<body>
		<h1>Fancify my Text</h1>
		

		<fieldset>
			<legend>Text</legend>
			<textarea rows="4" cols="30" id="main-text"></textarea>
		</fieldset>

		<fieldset>
			<legend>Fancify</legend>
			<button type="button" id="bigger" onclick="handleBigger()">Bigger!</button><br><br>
			<input type="radio" id="fancy" name="style" onchange="handleFancy()">
			<label for="fancy">FancyShmancy</label><br>
			<input type="radio" id="boring" name="style" onchange="handleBoring()">
			<label for="boring">BoringBetty</label>
			<button type="button" id="moo" onclick="handleMoo()">Moo</button>
		  </fieldset>
		
	</body>
</html>
